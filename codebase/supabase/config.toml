# Validated using Supabase CLI 2.117.0. Production scheduling is deliberately disabled.
project_id = "easygame"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:3000/workspace"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/workspace",
  "http://127.0.0.1:3000/**",
  "http://127.0.0.1:3000/auth/callback",
  "http://127.0.0.1:3000/workspace",
  "https://*.vercel.app/**",
  "https://*.vercel.app/auth/callback",
  "https://*.vercel.app/workspace"
]
jwt_expiry = 3600
enable_signup = false
[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
