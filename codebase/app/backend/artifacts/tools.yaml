tools:
  - name: query_notices
    description: "Tra cứu các thông báo chính thức đã xác thực và hạn nộp bài tập cho một chủ đề hoặc bài lab trong máy chủ khóa học."
    roles:
      - learner
      - lab_coach
    parameters:
      type: object
      properties:
        topicKey:
          type: string
          description: "Mã hoặc từ khóa định danh của bài lab, bài tập hoặc chủ đề khóa học (ví dụ: lab-1, lab-2, checkpoint, attendance)."
        guildId:
          type: string
          description: "Mã định danh máy chủ hoặc khóa học (ví dụ: demo)."
      required:
        - topicKey
        - guildId

  - name: search_web
    description: "Tìm kiếm tài liệu học tập trên các nguồn web bên ngoài hoặc kho tài liệu chính thức của khóa học (ví dụ: tài liệu VinUni AI 20K)."
    roles:
      - learner
      - lab_coach
    parameters:
      type: object
      properties:
        query:
          type: string
          description: "Chuỗi truy vấn hoặc từ khóa tìm kiếm tài liệu và tài nguyên học tập."
      required:
        - query

  - name: evaluate_radar
    description: "Rà soát các câu hỏi của học viên và tính toán các mức vi phạm SLA (Cảnh báo mềm Mức 1 sau 120 phút, Leo thang khẩn cấp Mức 2 sau 240 phút)."
    roles:
      - lab_coach
      - learner
    parameters:
      type: object
      properties:
        guildId:
          type: string
          description: "Mã định danh máy chủ hoặc khóa học (ví dụ: demo)."
        now:
          type: string
          description: "Dấu thời gian ISO hiện tại để tính toán thời gian chờ của câu hỏi."
      required:
        - guildId

  - name: create_staff_alert
    description: "Tạo thẻ cảnh báo nội bộ chỉ dành riêng cho ban trợ giảng vào kênh #ta-radar cho câu hỏi tồn đọng, câu hỏi chưa có thông báo hoặc học viên bị tắc bài."
    roles:
      - lab_coach
    parameters:
      type: object
      properties:
        guildId:
          type: string
          description: "Mã định danh máy chủ hoặc khóa học."
        questionId:
          type: string
          description: "Mã định danh câu hỏi của học viên cần leo thang hỗ trợ."
        tier:
          type: integer
          description: "Mức cảnh báo: 1 cho cảnh báo mềm (>2h), 2 cho leo thang khẩn cấp (>4h)."
        summary:
          type: string
          description: "Tóm tắt ngắn gọn thắc mắc hoặc khó khăn của học viên."
      required:
        - guildId
        - questionId
        - tier
        - summary

  - name: resolve_question
    description: "Đánh dấu một câu hỏi mở hoặc đã trả lời thành ĐÃ GIẢI QUYẾT (RESOLVED) bởi Lab Coach với cơ chế bảo vệ khóa lạc quan (optimistic locking)."
    roles:
      - lab_coach
    parameters:
      type: object
      properties:
        questionId:
          type: string
          description: "Mã định danh câu hỏi cần giải quyết."
        expectedVersion:
          type: integer
          description: "Số phiên bản hiện tại để kiểm tra khóa lạc quan."
      required:
        - questionId
        - expectedVersion

  - name: format_daily_digest
    description: "Tạo bản tin tổng hợp cuối ngày lúc 22:00 sạch lỗi, gom nhóm các chủ đề nóng nhất mà không chứa token rác."
    roles:
      - lab_coach
    parameters:
      type: object
      properties:
        guildId:
          type: string
          description: "Mã định danh máy chủ hoặc khóa học."
        localDate:
          type: string
          description: "Ngày dương lịch cần xuất bản tin theo định dạng YYYY-MM-DD."
      required:
        - guildId
        - localDate

  - name: broadcast_notification
    description: "Phát thông báo chính thức hoặc thông báo gia hạn deadline tới toàn thể học viên trong khóa học."
    roles:
      - lab_coach
    parameters:
      type: object
      properties:
        guildId:
          type: string
          description: "Mã định danh máy chủ hoặc khóa học."
        topicKey:
          type: string
          description: "Mã chủ đề của thông báo (ví dụ: lab-1, lab-2, announcements)."
        title:
          type: string
          description: "Tiêu đề của thông báo chính thức."
        content:
          type: string
          description: "Nội dung đầy đủ của thông báo."
        category:
          type: string
          description: "Danh mục thông báo (tùy chọn: urgent, general, logistics)."
      required:
        - guildId
        - topicKey
        - title
        - content

  - name: check_student_profile
    description: "Tra cứu thông tin hồ sơ học viên, đội nhóm được phân công, kênh hoạt động và lịch sử câu hỏi."
    roles:
      - lab_coach
    parameters:
      type: object
      properties:
        guildId:
          type: string
          description: "Mã định danh máy chủ hoặc khóa học."
        studentQuery:
          type: string
          description: "Tên học viên, email hoặc định danh người dùng cần tra cứu."
      required:
        - guildId
        - studentQuery

  - name: check_scores
    description: "Tra cứu điểm số bài lab hoặc checkpoint, tình trạng nộp bài và nhận xét chấm điểm của học viên."
    roles:
      - lab_coach
    parameters:
      type: object
      properties:
        guildId:
          type: string
          description: "Mã định danh máy chủ hoặc khóa học."
        studentQuery:
          type: string
          description: "Tên hoặc định danh học viên cần tra cứu điểm."
        lab:
          type: string
          description: "Mã bài lab hoặc bài tập cụ thể (tùy chọn: lab-1, checkpoint-1)."
      required:
        - guildId
        - studentQuery
